name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare local settings
        run: cp .env.example .env
      - name: Lint and type check
        run: make lint
      - name: Test HTTP endpoints and catalog
        run: make test
      - name: Smoke test Compose
        run: |
          make up
          make migrate
          docker compose exec -T tracker python -m alembic downgrade base
          docker compose exec -T tracker python -m alembic upgrade head
          make smoke
      - name: Stop Compose
        if: always()
        run: make down
