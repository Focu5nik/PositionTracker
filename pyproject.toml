[project]
name = "positiontracker"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "django==5.2.19",
    "fastapi==0.163.1",
    "psycopg[binary]==3.3.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["apps"]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["django", "django.*"]
ignore_missing_imports = true
